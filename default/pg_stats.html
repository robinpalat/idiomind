function showPage(num) {
    var pages = document.querySelectorAll('.section');
    pages.forEach(function(p) {
        p.classList.remove('active');
    });
    document.getElementById('page' + num).classList.add('active');
    currentPage = num;
    setTimeout(function(){ renderChart(num); }, 50);
}

function nextPage() {
    var next = currentPage >= 3 ? 1 : currentPage + 1;
    showPage(next);
}

document.addEventListener('click', function(e) {
    if (e.target.tagName === 'IMG' || e.target.tagName === 'SPAN' && e.target.classList.contains('arrow-left') || e.target.tagName === 'SPAN' && e.target.classList.contains('arrow-right')) return;
    nextPage();
});
