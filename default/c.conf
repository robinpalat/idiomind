# -*- ENCODING: UTF-8 -*-
#
# =============================================================================
# Idiomind - Configuración global del entorno
# =============================================================================
#
# ARCHIVO:
#   /usr/share/idiomind/default/c.conf
#
# FUNCIÓN:
#   Este archivo inicializa el entorno común de Idiomind.
#
#   Es cargado mediante "source" desde scripts.
#
#   Su responsabilidad es centralizar y preparar:
#
#     - Configuración de gettext y traducciones.
#     - Directorios temporales y de instalación.
#     - Topic actualmente seleccionado.
#     - Idioma de aprendizaje y lengua de origen.
#     - Directorios de datos, configuración y addons.
#     - Rutas de las bases de datos SQLite.
#     - Configuración de interfaz y sintetizador.
#     - Variables de entorno utilizadas por el resto de Idiomind.
#
#   Construye el "contexto global" que los
#   demás módulos de Idiomind necesitan para saber:
#
#       quién es el usuario,
#       dónde están sus datos,
#       qué topic está utilizando,
#       qué idiomas están configurados,
#       y dónde están las bases de datos y recursos de Idiomind.
#
# USO DESDE main.sh:
#
#   source /usr/share/idiomind/default/c.conf
#
#   Al utilizar "source", las variables exportadas aquí pasan a formar parte
#   del entorno del proceso de main.sh y pueden ser utilizadas por las
#   funciones posteriores, por ejemplo new_session().
#
# IMPORTANTE:
#   Este archivo debe contener principalmente inicialización y configuración.
#   Los cambios aquí pueden afectar prácticamente a toda la aplicación.
#
# =============================================================================


# -----------------------------------------------------------------------------
# 1. INTERNACIONALIZACIÓN / GETTEXT
# -----------------------------------------------------------------------------

# Dominio utilizado por gettext para buscar las traducciones de Idiomind.
TEXTDOMAIN="idiomind"

# Directorio del sistema donde se encuentran los archivos de traducción.
TEXTDOMAINDIR="/usr/share/locale"

# Permite utilizar:
#
#     gettext "Texto"
#
# como abreviación de:
#
#     gettext idiomind "Texto"
#
# Los mensajes de la aplicación pueden ser traducidos
# utilizando el dominio "idiomind".
alias gettext="gettext idiomind"


# -----------------------------------------------------------------------------
# 2. DIRECTORIOS PRINCIPALES
# -----------------------------------------------------------------------------

# Directorio temporal utilizado durante la ejecución de Idiomind.
#
# Se encuentra dentro de /tmp y es específico para el usuario actual.
# Aquí se almacenan archivos temporales, locks, estados de ejecución, etc.
export DT="/tmp/.idiomind-$USER"

# Directorio donde está instalada la aplicación Idiomind.
export DS="/usr/share/idiomind"


# -----------------------------------------------------------------------------
# 3. TOPIC ACTUAL
# -----------------------------------------------------------------------------

# Lee la primera línea del archivo "tpc", que contiene el topic actualmente
# activo.
#
# Ejemplo conceptual:
#
#   ~/.config/idiomind/tpc
#       |
#       +--> "english"
#
# Entonces:
#
#   tpc="english"
#
export tpc="$(sed -n 1p "$HOME/.config/idiomind/tpc")"


# Si existe un archivo temporal "tpe", utiliza su primera línea como topic.
#
# Esto permite que determinados procesos temporales puedan establecer o
# sobrescribir el topic utilizado durante una ejecución.
if [ -f $DT/tpe ]; then
    export tpe="$(sed -n 1p $DT/tpe)"
fi


# -----------------------------------------------------------------------------
# 4. CONFIGURACIÓN INICIAL
# -----------------------------------------------------------------------------

# Si todavía no existe la base de configuración del usuario, se solicita
# a Idiomind que la cree mediante tls.sh.
#
# Esto garantiza que las consultas SQLite posteriores realizadas por este
# archivo tengan una base de datos válida.
if [ ! -f "$HOME/.config/idiomind/config" ]; then
    "$DS/ifs/tls.sh" create_cfgdb
fi


# -----------------------------------------------------------------------------
# 5. IDIOMAS CONFIGURADOS
# -----------------------------------------------------------------------------

# Idioma que el usuario está aprendiendo.
#
# Se obtiene de la tabla "lang" de la base de configuración.
export tlng="$(sqlite3 "$HOME/.config/idiomind/config" "select tlng from lang;")"

# Idioma de origen / idioma utilizado como referencia.
export slng="$(sqlite3 "$HOME/.config/idiomind/config" "select slng from lang;")"


# -----------------------------------------------------------------------------
# 6. ESTRUCTURA DE DATOS DEL USUARIO
# -----------------------------------------------------------------------------

# Directorio raíz de datos personales de Idiomind.
export DM="$HOME/.idiomind"

# Directorio que contiene los topics del usuario.
export DM_t="$HOME/.idiomind/topics"

# Directorio de topics correspondiente al idioma que se está aprendiendo.
#
# Ejemplo:
#
#   ~/.idiomind/topics/en
#
export DM_tl="$HOME/.idiomind/topics/$tlng"

# Directorio compartido asociado al idioma.
# Contiene datos comunes y la base de datos compartida de topics.
export DM_tls="$HOME/.idiomind/topics/$tlng/.share"

# Directorio del topic actualmente seleccionado.
#
# Ejemplo:
#
#   ~/.idiomind/topics/en/my_topic
#
export DM_tlt="$HOME/.idiomind/topics/$tlng/$tpc"


# -----------------------------------------------------------------------------
# 7. DIRECTORIOS DE CONFIGURACIÓN
# -----------------------------------------------------------------------------

# Directorio principal de configuración de Idiomind.
export DC="$HOME/.config/idiomind"

# Directorio donde se encuentran los addons instalados/configurados.
export DC_a="$HOME/.config/idiomind/addons"

# Directorio de recursos habilitados de los addons.
export DC_d="$HOME/.config/idiomind/addons/resources/enables"

# Alias histórico/alternativo para el directorio de configuración.
export DC_s="$HOME/.config/idiomind"

# Directorio de configuración del topic actual.
#
# Cada topic dispone de su propio directorio .conf.
export DC_tlt="$HOME/.idiomind/topics/$tlng/$tpc/.conf"


# Directorio donde están instalados los addons proporcionados por Idiomind.
export DS_a="/usr/share/idiomind/addons"


# -----------------------------------------------------------------------------
# 8. BASES DE DATOS SQLITE
# -----------------------------------------------------------------------------

# Base de datos principal de configuración de Idiomind.
#
# Contiene, entre otras cosas, información sobre idioma, interfaz y
# configuración general.
export cfgdb="$DC_s/config"

# Base de datos compartida de topics.
export shrdb="$DM_tls/data/config"

# Base de datos de vocabulario correspondiente al idioma de aprendizaje.
#
# El nombre de la base se construye dinámicamente utilizando $tlng.
#
# Ejemplo:
#
#   ~/.idiomind/topics/en/.share/data/en.db
#
export tlngdb="$DM_tls/data/${tlng}.db"

# Base de datos específica del topic actual.
export tpcdb="$DC_tlt/tpc"


# -----------------------------------------------------------------------------
# 9. CONFIGURACIÓN DE INTERFAZ
# -----------------------------------------------------------------------------

# Obtiene de SQLite la interfaz gráfica configurada por el usuario.
#
# La información se obtiene de:
#
#   tabla: opts
#   campo: intrf
#
export intrf="$(sqlite3 "$cfgdb" "select intrf from opts;")"


# Determina el idioma utilizado por la interfaz.
#
# Si la interfaz configurada no coincide con el idioma de la variable LANG
# y además no está configurada como "Default", se utiliza explícitamente
# esa interfaz.
#
# En caso contrario, se utiliza inglés como idioma predeterminado.
if ! grep $intrf <<< $LANG >/dev/null 2>&1 && [[ $intrf != Default ]]; then
    LANGUAGE=$intrf
else
    LANGUAGE=en
fi


# -----------------------------------------------------------------------------
# 10. SINTETIZADOR DE VOZ
# -----------------------------------------------------------------------------

# Obtiene de SQLite el sintetizador configurado por el usuario.
export synth="$(sqlite3 "$cfgdb" "select synth from opts;")"


# -----------------------------------------------------------------------------
# 11. USER AGENT
# -----------------------------------------------------------------------------

# User-Agent utilizado por las operaciones de red que lo necesiten.
#
# Se mantiene con una identificación compatible con navegadores antiguos.
export useragent="Mozilla/5.0 (X11; Ubuntu; Linux i686; rv:31.0) Gecko/20100101 Firefox/31.0"


# -----------------------------------------------------------------------------
# 12. VARIABLES DE ENTORNO PARA INTERNACIONALIZACIÓN
# -----------------------------------------------------------------------------

# Exporta las variables necesarias para que los procesos hijos conozcan
# el sistema de traducción configurado por Idiomind.
export TEXTDOMAIN TEXTDOMAINDIR LANGUAGE


# =============================================================================
# RESUMEN DE RESPONSABILIDADES
# =============================================================================
#
# c.conf funciona como una capa de inicialización común para Idiomind. 
# Prepara todos los datos y rutas necesarios para que esa lógica pueda
# ejecutarse.
#
# La secuencia conceptual es:
#
#       c.conf
#          |
#          +-- Inicializa gettext
#          |
#          +-- Determina topic actual
#          |
#          +-- Determina idiomas
#          |
#          +-- Construye rutas de datos
#          |
#          +-- Localiza bases SQLite
#          |
#          +-- Lee preferencias
#          |
#          +-- Exporta variables
#          |
#          v
#       main.sh
#          |
#          +-- new_session()
#          |
#          +-- funciones y módulos de Idiomind
#
# Este archivo tiene un papel estructural: actúa como el "bootstrap de configuración" del entorno de
# Idiomind.
#
# =============================================================================
